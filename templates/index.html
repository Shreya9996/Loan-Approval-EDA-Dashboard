<!DOCTYPE html>
<html>

<head>
    <title>Loan Approval Prediction</title>
</head>

<body>

    <h2>Loan Approval Prediction</h2>

    <form id="loanForm">

        <label>Name:</label>
        <input type="text" id="name" required><br><br>

        <label>Age:</label>
        <input type="number" id="age" required><br><br>

        <label>Email:</label>
        <input type="email" id="email" required><br><br>

        <label>Phone:</label>
        <input type="text" id="phone" required><br><br>

        <label>Income:</label>
        <input type="number" id="income" required><br><br>

        <label>Home Ownership:</label>
        <select id="ownership">
            <option>RENT</option>
            <option>OWN</option>
            <option>MORTGAGE</option>
            <option>OTHER</option>
        </select><br><br>

        <label>Interest Rate:</label>
        <input type="number" step="0.01" id="rate" required><br><br>

        <label>Loan Percent Income:</label>
        <input type="number" step="0.01" id="percent" required><br><br>

        <label>Previous Loan Default:</label>
        <select id="default">
            <option>NO</option>
            <option>YES</option>
        </select><br><br>

        <button type="submit">Predict</button>

    </form>

    <h3 id="result"></h3>

    <script>
        document.getElementById("loanForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const data = {
                name: document.getElementById("name").value,
                age: parseInt(document.getElementById("age").value),

                person_income: parseFloat(document.getElementById("income").value),
                person_home_ownership: document.getElementById("ownership").value,
                loan_int_rate: parseFloat(document.getElementById("rate").value),
                loan_percent_income: parseFloat(document.getElementById("percent").value),
                previous_loan_defaults_on_file: document.getElementById("default").value,

                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value
            };

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log(result);

                document.getElementById("result").innerText = result.prediction;

            } catch (error) {
                console.error("Error:", error);
                document.getElementById("result").innerText = "Error occurred";
            }
        });
    </script>
</body>

</html>
